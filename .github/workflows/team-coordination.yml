name: Team coordination
on:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write

jobs:
  post-merge-note:
    runs-on: ubuntu-latest
    steps:
      - name: Post merge note to Team coordination issue
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const actor = context.actor;

            // 1) Find or create the coordination issue
            const title = "Team coordination";
            let issueNumber = null;
            const issues = await github.rest.issues.listForRepo({
              owner, repo, state: "open", per_page: 100
            });
            const found = issues.data.find(i => !i.pull_request && i.title === title);
            if (found) {
              issueNumber = found.number;
            } else {
              const created = await github.rest.issues.create({
                owner, repo,
                title,
                body: "Track Mboka AI P1–P9 progress. Each merge to main posts a note below."
              });
              issueNumber = created.data.number;
            }

            // 2) Map changed files to tasks (from ARCHITECTURE.md People table)
            const pathMap = [
              { files: ["lib/store.ts", "server.ts"], task: "P1 — Split the repo + listings store", unblocks: "P2, P3, P4, P5, P7, P8" },
              { files: ["lib/elevenlabs.ts"], task: "P2 — Live URL + Swahili voice test", unblocks: "P6, P7 (STT/TTS for call)" },
              { files: ["lib/extract.ts"], task: "P3 — Extraction API", unblocks: "P4, P7 (/extract endpoint)" },
              { files: ["public/index.html"], task: "P4 — Confirm panel talks to extract", unblocks: "P5 (feed separation)" },
              { files: ["public/feed.js"], task: "P5 — Buyer: tap a listing", unblocks: "—" },
              { files: ["routes/call.ts"], task: "P6/P7 — Call: answer + confirm + post", unblocks: "—" },
              { files: ["public/ussd.html"], task: "P8 — USSD simulator", unblocks: "P9 (demo)" }
            ];

            // 3) Collect changed files from this push
            const commits = context.payload.commits || [];
            const changedFiles = new Set();
            for (const c of commits) {
              try {
                const detail = await github.rest.repos.getCommit({
                  owner, repo, ref: c.id
                });
                for (const f of detail.data.files) changedFiles.add(f.filename);
              } catch (e) {
                core.warning(`Could not fetch commit ${c.id}: ${e.message}`);
              }
            }

            // 4) Determine which tasks this push completes
            const tasks = [];
            for (const { files, task, unblocks } of pathMap) {
              if (files.some(f => changedFiles.has(f))) {
                if (!tasks.find(t => t.task === task)) tasks.push({ task, unblocks });
              }
            }

            // Fallback: infer from commit message if no path matched
            if (tasks.length === 0) {
              const msg = (context.payload.head_commit && context.payload.head_commit.message) || "Merged to main";
              const m = msg.match(/P[1-9]/i);
              if (m) tasks.push({ task: m[0].toUpperCase(), unblocks: "see ARCHITECTURE.md" });
              else tasks.push({ task: msg.split("\n")[0], unblocks: "see ARCHITECTURE.md" });
            }

            // 5) Post one comment per detected task
            const shas = commits.map(c => c.id.slice(0, 7)).join(", ");
            for (const { task, unblocks } of tasks) {
              const body = [
                `🚀 **${task}** merged to \`main\` by **@${actor}** (${shas})`,
                `➡️ Unblocks: ${unblocks}`,
                `👤 Next owner: update your row in \`ARCHITECTURE.md → People (P1–P9)\``
              ].join("\n\n");
              await github.rest.issues.createComment({
                owner, repo, issue_number: issueNumber, body
              });
            }