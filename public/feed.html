<!DOCTYPE html>
<html lang="sw" data-day>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#efe6d2" />
  <meta name="description" content="Soko la jua kali. Browse listings, hear the trader, Call or WhatsApp." />
  <title>Mboka — Soko</title>
  <link rel="stylesheet" href="/mboka.css" />
</head>
<body data-page="buyer">
  <a class="skip" href="#main">Nenda kwenye listing</a>

  <header class="topbar">
    <a class="brand" href="/feed.html">
      <span class="sw">Mboka</span>
      <span class="en">The market feed</span>
    </a>
    <nav class="top-nav" aria-label="Primary">
      <a href="/"><span class="sw">Uza</span><span class="en">Sell</span></a>
      <a href="/feed.html" aria-current="page"><span class="sw">Soko</span><span class="en">Market</span></a>
      <a href="/call.html"><span class="sw">Simu</span><span class="en">Call</span></a>
      <a href="/board.html"><span class="sw">Jukwaa</span><span class="en">Board</span></a>
      <a href="/ussd.html"><span class="sw">*384#</span><span class="en">Any phone</span></a>
    </nav>
  </header>

  <div class="hem" aria-hidden="true">
    <span class="hem-rule"></span>
    <p>Sauti yako ndiyo duka lako</p>
    <span class="hem-rule"></span>
  </div>

  <main id="main" class="shell">
    <section id="feedView" class="view">
      <div class="signboard">
        <h1 class="display offset" data-text="Soko">Soko</h1>
        <p class="lede">
          <span class="sw">Listing mpya juu. Ilisema, ilipigwa simu, au iliingia kwa simu ya kawaida.</span>
          <span class="en">Newest listings from web, call, and USSD.</span>
        </p>
        <label class="search">
          <span class="visually-hidden">Tafuta listing</span>
          <input id="searchQuery" type="search" placeholder="Tafuta kitu au eneo" autocomplete="off" />
        </label>
        <div class="chips" id="filters" role="tablist" aria-label="Aina"></div>
      </div>

      <div class="toolbar">
        <select id="locationFilter" aria-label="Filter by location"></select>
        <div class="feed-tabs" role="tablist" aria-label="Whose listings">
          <button type="button" id="tabAll" class="active">Zote · All</button>
          <button type="button" id="tabMine">Zangu · Mine</button>
        </div>
      </div>

      <label class="phone-row">
        <span>Simu yako</span>
        <input id="myPhone" type="tel" inputmode="tel" placeholder="Inahitajika kwa Zangu" autocomplete="tel" />
      </label>

      <div class="feed-meta">
        <p id="feedCount">Inapakia listing…</p>
        <p id="feedUpdated"></p>
      </div>

      <div id="feed" class="feed-grid" aria-live="polite"></div>
      <p class="sponsors">Cursor · ElevenLabs · Render</p>
    </section>

    <section id="detailView" class="view" hidden>
      <div id="detailPage"></div>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="/feed.js"></script>
</body>
</html>
